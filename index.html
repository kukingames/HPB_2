<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<section id="start">

    <h1>🎀 Happy Birthday 🎀</h1>

<p class="sub">
    <span id="birthdayName"></span>ちゃんへ
</p>

<div class="envelope" onclick="openLetter()">✉️
    <p class="envelope-title">タップして開く</p>
</div>

<p>by くーとより</p>
</section>

<div id="countdown">3</div>

<section id="main">
<h1>🎂 Happy Birthday 🎂</h1>

<div class="card reveal">
<h2>ゆづき先輩へ</h2>
<p>お誕生日おめでとうございます！✨<br><br>素敵な一年になりますように！</p>
</div>

<div class="card reveal">
<h2>メッセージ</h2>
<p>いつもありがとうございます😊<br>これからもよろしくお願いします！<br>仲良くしてください笑</p>
</div>



<button id="secretBtn">🎁 Secret Message</button>
<div id="secretMessage">ちゃんと話したことないですよね〜<br>いつかお話できたらいいなと思ってます。</div>

<div class="footer">✨ Have a Wonderful Birthday ✨</div>
</section>

<script src="script.js"></script>
</body>
</html>
